<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>FluentCode - Cadastro</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        /* =========================================================
           BASE
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(37, 99, 235, .18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(124, 58, 237, .14),
                    transparent 32%
                ),
                #07111f;

            color: #fff;

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            overflow-x: hidden;
        }


        /* =========================================================
           GRID DE FUNDO
        ========================================================= */

        body::before {
            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background-image:
                linear-gradient(
                    rgba(255,255,255,.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.025) 1px,
                    transparent 1px
                );

            background-size: 42px 42px;

            opacity: .35;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 90%
                );

            z-index: -2;
        }


        /* =========================================================
           ELEMENTOS DECORATIVOS
        ========================================================= */

        .orb {
            position: fixed;

            border-radius: 50%;

            pointer-events: none;

            filter: blur(60px);

            opacity: .12;

            z-index: -1;
        }


        .orb-one {
            width: 220px;

            height: 220px;

            top: 8%;

            left: -90px;

            background: #2563eb;
        }


        .orb-two {
            width: 260px;

            height: 260px;

            right: -100px;

            bottom: 4%;

            background: #7c3aed;
        }


        /* =========================================================
           CONTAINER
        ========================================================= */

        .page {
            width: 100%;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px 18px;
        }


        .content {
            width: 100%;

            max-width: 470px;
        }


        /* =========================================================
           BRAND
        ========================================================= */

        .brand {
            text-align: center;

            margin-bottom: 25px;
        }


        .brand-icon {
            width: 58px;

            height: 58px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 0 auto 14px;

            border-radius: 17px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            box-shadow:
                0 0 35px rgba(59,130,246,.28);

            font-size: 24px;

            animation: floating 4s ease-in-out infinite;
        }


        @keyframes floating {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }

        }


        .brand-name {
            margin: 0;

            font-size: 38px;

            line-height: 1;

            font-weight: 900;

            letter-spacing: -1px;

            background:
                linear-gradient(
                    90deg,
                    #60a5fa,
                    #a78bfa,
                    #22d3ee
                );

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;
        }


        .brand-subtitle {
            margin-top: 10px;

            color: #718096;

            font-size: 13px;

            letter-spacing: .2px;
        }


        /* =========================================================
           CARD
        ========================================================= */

        .register-card {
            position: relative;

            overflow: hidden;

            padding: 28px;

            border-radius: 25px;

            border:
                1px solid rgba(148,163,184,.13);

            background:
                linear-gradient(
                    145deg,
                    rgba(15,35,60,.91),
                    rgba(7,18,32,.94)
                );

            backdrop-filter: blur(18px);

            box-shadow:
                0 30px 80px rgba(0,0,0,.34);
        }


        .register-card::before {
            content: "";

            position: absolute;

            top: 0;

            left: 12%;

            right: 12%;

            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #3b82f6,
                    #8b5cf6,
                    transparent
                );

            opacity: .75;
        }


        .register-card::after {
            content: "</>";

            position: absolute;

            right: -5px;

            bottom: -27px;

            color: rgba(96,165,250,.035);

            font-size: 105px;

            font-weight: 900;

            transform: rotate(-10deg);

            pointer-events: none;
        }


        .card-content {
            position: relative;

            z-index: 2;
        }


        /* =========================================================
           TÍTULO
        ========================================================= */

        .card-header {
            text-align: center;

            margin-bottom: 25px;
        }


        .card-header h2 {
            margin: 0;

            font-size: 23px;

            font-weight: 850;

            letter-spacing: -.5px;
        }


        .card-header p {
            margin-top: 7px;

            color: #64748b;

            font-size: 13px;
        }


        /* =========================================================
           CAMPOS
        ========================================================= */

        .field {
            margin-bottom: 17px;
        }


        .field label {
            display: flex;

            align-items: center;

            gap: 7px;

            margin-bottom: 7px;

            color: #a8b4c4;

            font-size: 12px;

            font-weight: 700;
        }


        .field label i {
            color: #60a5fa;

            font-size: 11px;

            width: 13px;

            text-align: center;
        }


        .input-wrapper {
            position: relative;
        }


        .input-wrapper i {
            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            color: #475569;

            font-size: 14px;

            pointer-events: none;

            transition: color .2s ease;
        }


        .input-wrapper input {
            width: 100%;

            height: 49px;

            padding:
                0
                15px
                0
                43px;

            border-radius: 13px;

            border:
                1px solid rgba(71,85,105,.65);

            outline: none;

            background:
                rgba(5,15,28,.78);

            color: #fff;

            font-size: 14px;

            transition:
                border-color .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }


        .input-wrapper input::placeholder {
            color: #475569;
        }


        .input-wrapper input:hover {
            border-color:
                rgba(96,165,250,.25);
        }


        .input-wrapper input:focus {
            border-color: #3b82f6;

            background:
                rgba(8,20,36,.95);

            box-shadow:
                0 0 0 3px rgba(59,130,246,.1);
        }


        .input-wrapper:focus-within > i {
            color: #60a5fa;
        }


        /* =========================================================
           INDICADOR DE SENHA
        ========================================================= */

        .password-hint {
            display: flex;

            align-items: center;

            gap: 6px;

            margin-top: 7px;

            color: #475569;

            font-size: 10px;
        }


        .password-hint i {
            color: #22c55e;
        }


        /* =========================================================
           BOTÃO
        ========================================================= */

        .register-button {
            width: 100%;

            height: 51px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            margin-top: 8px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #16a34a,
                    #22c55e
                );

            color: #fff;

            font-size: 14px;

            font-weight: 850;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(34,197,94,.12);

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                filter .2s ease;
        }


        .register-button:hover {
            transform: translateY(-2px);

            filter: brightness(1.08);

            box-shadow:
                0 15px 32px rgba(34,197,94,.2);
        }


        .register-button:active {
            transform: scale(.98);
        }


        /* =========================================================
           LOGIN
        ========================================================= */

        .login-area {
            text-align: center;

            margin-top: 21px;

            padding-top: 19px;

            border-top:
                1px solid rgba(148,163,184,.08);

            color: #64748b;

            font-size: 12px;
        }


        .login-area a {
            color: #60a5fa;

            font-weight: 800;

            text-decoration: none;

            transition: color .2s ease;
        }


        .login-area a:hover {
            color: #93c5fd;

            text-decoration: underline;
        }


        /* =========================================================
           RODAPÉ
        ========================================================= */

        .footer {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            margin-top: 18px;

            color: #334155;

            font-size: 10px;
        }


        .footer i {
            color: #475569;
        }


        /* =========================================================
           RESPONSIVO
        ========================================================= */

        @media (max-width: 500px) {

            .page {
                padding:
                    22px
                    14px;
            }


            .brand-name {
                font-size: 33px;
            }


            .brand-icon {
                width: 52px;

                height: 52px;

                font-size: 21px;
            }


            .register-card {
                padding: 23px 18px;

                border-radius: 21px;
            }


            .card-header h2 {
                font-size: 21px;
            }


            .field {
                margin-bottom: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- ELEMENTOS DECORATIVOS -->

    <div class="orb orb-one"></div>

    <div class="orb orb-two"></div>



    <main class="page">


        <div class="content">


            <!-- =================================================
                 LOGO
            ================================================== -->

            <div class="brand">

                <div class="brand-icon">

                    <i class="fa-solid fa-code"></i>

                </div>


                <h1 class="brand-name">

                    FluentCode

                </h1>


                <p class="brand-subtitle">

                    Learning • Java • English

                </p>

            </div>



            <!-- =================================================
                 CARD DE CADASTRO
            ================================================== -->

            <section class="register-card">

                <div class="card-content">


                    <div class="card-header">

                        <h2>

                            Criar sua conta

                        </h2>


                        <p>

                            Comece sua jornada no FluentCode

                        </p>

                    </div>



                    <!-- =========================================
                         USUÁRIO
                    ========================================== -->

                    <div class="field">

                        <label for="user">

                            <i class="fa-solid fa-user"></i>

                            Nome de usuário

                        </label>


                        <div class="input-wrapper">

                            <i class="fa-solid fa-at"></i>


                            <input
                                id="user"
                                type="text"
                                autocomplete="username"
                                placeholder="Ex: DevLucas"
                            >

                        </div>

                    </div>



                    <!-- =========================================
                         EMAIL
                    ========================================== -->

                    <div class="field">

                        <label for="email">

                            <i class="fa-solid fa-envelope"></i>

                            E-mail

                        </label>


                        <div class="input-wrapper">

                            <i class="fa-solid fa-envelope"></i>


                            <input
                                id="email"
                                type="email"
                                autocomplete="email"
                                placeholder="Ex: devlucas@gmail.com"
                            >

                        </div>

                    </div>



                    <!-- =========================================
                         SENHA
                    ========================================== -->

                    <div class="field">

                        <label for="pass">

                            <i class="fa-solid fa-lock"></i>

                            Senha

                        </label>


                        <div class="input-wrapper">

                            <i class="fa-solid fa-key"></i>


                            <input
                                id="pass"
                                type="password"
                                autocomplete="new-password"
                                placeholder="Crie uma senha"
                            >

                        </div>


                        <div class="password-hint">

                            <i class="fa-solid fa-shield-halved"></i>

                            Use uma senha que você consiga lembrar.

                        </div>

                    </div>



                    <!-- =========================================
                         CONFIRMAR SENHA
                    ========================================== -->

                    <div class="field">

                        <label for="confirm">

                            <i class="fa-solid fa-check"></i>

                            Confirmar senha

                        </label>


                        <div class="input-wrapper">

                            <i class="fa-solid fa-lock"></i>


                            <input
                                id="confirm"
                                type="password"
                                autocomplete="new-password"
                                placeholder="Repita sua senha"
                            >

                        </div>

                    </div>



                    <!-- =========================================
                         BOTÃO
                    ========================================== -->

                    <button
                        onclick="register()"
                        class="register-button"
                        type="button">

                        <i class="fa-solid fa-user-plus"></i>

                        Criar minha conta

                    </button>



                    <!-- =========================================
                         LOGIN
                    ========================================== -->

                    <div class="login-area">

                        Já possui uma conta?

                        <a href="login.html">

                            Entrar no FluentCode

                        </a>

                    </div>


                </div>

            </section>



            <!-- =================================================
                 RODAPÉ
            ================================================== -->

            <div class="footer">

                <i class="fa-solid fa-code"></i>

                <span>
                    Aprenda. Pratique. Evolua.
                </span>

            </div>


        </div>

    </main>



    <script>

        /*
        ==========================================================
        CADASTRO
        ==========================================================
        */

        async function register() {


            // ================================================
            // PEGA OS DADOS DIGITADOS
            // ================================================

            const user = document
                .getElementById("user")
                .value
                .trim();


            const email = document
                .getElementById("email")
                .value
                .trim();


            const pass = document
                .getElementById("pass")
                .value;


            const confirm = document
                .getElementById("confirm")
                .value;



            // ================================================
            // VERIFICA CAMPOS
            // ================================================

            if (!user || !email || !pass || !confirm) {

                alert(
                    "Preencha todos os campos!"
                );

                return;
            }



            // ================================================
            // VERIFICA E-MAIL
            // ================================================

            if (!email.includes("@")) {

                alert(
                    "Digite um e-mail válido!"
                );

                return;
            }



            // ================================================
            // VERIFICA SENHAS
            // ================================================

            if (pass !== confirm) {

                alert(
                    "As senhas não coincidem!"
                );

                return;
            }



            // ================================================
            // ENVIA PARA O NODE.JS
            // ================================================

            try {

                const resposta = await fetch(
                    "/cadastro",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            usuario: user,

                            email: email,

                            senha: pass

                        })

                    }
                );



                // ============================================
                // RECEBE RESPOSTA DO SERVIDOR
                // ============================================

                const dados =
                    await resposta.json();



                // ============================================
                // CADASTRO REALIZADO
                // ============================================

                if (dados.sucesso) {

                    alert(
                        dados.mensagem
                    );


                    /*
                     * Depois de cadastrar,
                     * volta para o login.
                     */

                    window.location.href =
                        "login.html";


                } else {


                    /*
                     * Caso o servidor informe algum erro.
                     */

                    alert(
                        dados.mensagem
                    );

                }


            } catch (erro) {

                console.error(
                    "Erro ao cadastrar:",
                    erro
                );


                alert(
                    "Não foi possível conectar ao servidor."
                );

            }

        }

    </script>


</body>

</html>
